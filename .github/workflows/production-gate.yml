name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Syntax checks
        run: |
          node --check server.js
          node --check lib/db.js
          node --check lib/r2-storage.js
          node --check lib/security-hardening.js
          node --check scripts/production-gate.js

      - name: Production security and concurrency gate
        run: node scripts/production-gate.js
